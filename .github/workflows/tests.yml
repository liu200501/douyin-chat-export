name: Tests

# 全部测试集中在这个工作流：Python pytest + 前端 vitest/build。
# Python 测试在 Linux 与 Windows 双平台运行，用于验证 Windows 原生运行的兼容性。
on:
  # 直接响应 push/PR（这样分支 push 或 fork 内 PR 都能跑测试），
  # 同时支持被 ci.yml 通过 workflow_call 复用与手动触发。
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # requirements-dev.txt = requirements.txt + pytest。
        # 只装 pip 包，不装 Playwright 浏览器：测试是离线特征测试，不启动浏览器。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Stub frontend dist
        # backend.main 只在 frontend/dist 存在时才注册 SPA 路由；路由契约测试
        # 要断言完整路由表，所以造个空壳。PowerShell 与 bash 都要能建。
        shell: bash
        run: mkdir -p frontend/dist/assets && touch frontend/dist/index.html

      - name: Run pytest
        run: python -m pytest -q

  frontend-tests:
    name: Frontend tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
